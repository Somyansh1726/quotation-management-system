<html lang="en">

  <!-- =================================================
       REVISION PREFILL SCRIPT
  ================================================== -->

  <script>

    document.addEventListener('DOMContentLoaded', function () {

      {% if revision_mode %}

      const revisionItems = {{ revision_items | tojson
    }};
    const originalTerms =
      {{ revision_quotation.termsData | default ('[]') | tojson }};

    const itemsContainer =
      document.getElementById('itemsContainer');

    const addItemButton =
      document.getElementById('addItemButton');

    const termsList =
      document.getElementById('termsList');

    const termsDataInput =
      document.getElementById('termsData');


    /* --------------------------------
       LOAD OLD TERMS
    --------------------------------- */

    let parsedTerms = [];

    try {

      parsedTerms =
        JSON.parse(originalTerms || '[]');

      if (!Array.isArray(parsedTerms)) {
        parsedTerms = [];
      }

    } catch (error) {

      parsedTerms = [];

    }


    if (parsedTerms.length > 0) {

      termsList.innerHTML = '';

      parsedTerms.forEach(function (term) {

        const li =
          document.createElement('li');

        li.textContent = term;

        termsList.appendChild(li);

      });

      termsDataInput.value =
        JSON.stringify(parsedTerms);

    }


    /* --------------------------------
       LOAD OLD ITEMS
    --------------------------------- */

    if (
      Array.isArray(revisionItems) &&
      revisionItems.length > 0
    ) {

      const rows =
        itemsContainer.querySelectorAll('.item-row');


      if (rows.length === 0) {
        addItemButton.click();
      }


      let itemRows =
        itemsContainer.querySelectorAll('.item-row');


      revisionItems.forEach(function (item, index) {

        if (index > 0) {
          addItemButton.click();
        }


        itemRows =
          itemsContainer.querySelectorAll('.item-row');


        const row =
          itemRows[index];


        if (!row) {
          return;
        }


        const nameInput =
          row.querySelector(
            'input[name="itemName[]"]'
          );

        const modelInput =
          row.querySelector(
            'input[name="modelNo[]"]'
          );

        const specsInput =
          row.querySelector(
            'input[name="specifications[]"]'
          );

        const qtyInput =
          row.querySelector(
            'input[name="itemQuantity[]"]'
          );

        const priceInput =
          row.querySelector(
            'input[name="unitPrice[]"]'
          );


        if (nameInput) {
          nameInput.value =
            item.itemName || '';
        }

        if (modelInput) {
          modelInput.value =
            item.modelNo || '';
        }

        if (specsInput) {
          specsInput.value =
            item.specifications || '';
        }

        if (qtyInput) {
          qtyInput.value =
            item.itemQuantity || '';
        }

        if (priceInput) {
          priceInput.value =
            item.unitPrice || '';
        }


        if (qtyInput) {

          qtyInput.dispatchEvent(
            new Event(
              'input',
              { bubbles: true }
            )
          );

        }


        if (priceInput) {

          priceInput.dispatchEvent(
            new Event(
              'input',
              { bubbles: true }
            )
          );

        }

      });

    }

    {% endif %}


    /* --------------------------------
       TERMS CHECKBOX
    --------------------------------- */

    const form =
      document.querySelector(
        '.form-container'
      );

    const agreeTerms =
      document.getElementById(
        'agreeTerms'
      );


    if (form && agreeTerms) {

      form.addEventListener(
        'submit',
        function (event) {

          if (!agreeTerms.checked) {

            event.preventDefault();

            agreeTerms.focus();

            alert(
              'Please agree to the Terms of Sale before submitting the quotation.'
            );

          }

        }
      );

    }

    });


    /* --------------------------------
       DATE VALIDATION
    --------------------------------- */

    function validateQuotationDates() {

      const quotationDate =
        document.getElementById(
          "quotationDate"
        );

      const quotationExpiry =
        document.getElementById(
          "quotationExpiry"
        );

      const formMessage =
        document.getElementById(
          "formMessage"
        );


      if (
        !quotationDate ||
        !quotationExpiry
      ) {
        return true;
      }


      if (!quotationDate.value) {

        if (formMessage) {

          formMessage.textContent =
            "Please select the quotation date.";

          formMessage.style.color =
            "#dc3545";

        }

        quotationDate.focus();

        return false;
      }


      if (!quotationExpiry.value) {

        if (formMessage) {

          formMessage.textContent =
            "Please select the expiry date.";

          formMessage.style.color =
            "#dc3545";

        }

        quotationExpiry.focus();

        return false;
      }


      if (
        quotationExpiry.value <
        quotationDate.value
      ) {

        if (formMessage) {

          formMessage.textContent =
            "Expiry date cannot be before the quotation date.";

          formMessage.style.color =
            "#dc3545";

        }

        quotationExpiry.focus();


        quotationExpiry.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });


        return false;

      }


      return true;

    }


    /* --------------------------------
       EXPIRY DATE MINIMUM
    --------------------------------- */

    const quotationDate =
      document.getElementById(
        "quotationDate"
      );

    const quotationExpiry =
      document.getElementById(
        "quotationExpiry"
      );


    if (
      quotationDate &&
      quotationExpiry
    ) {

      quotationDate.addEventListener(
        "change",
        function () {

          quotationExpiry.min =
            quotationDate.value;


          if (
            quotationExpiry.value &&
            quotationExpiry.value <
            quotationDate.value
          ) {

            quotationExpiry.value = "";

          }

        }
      );


      if (quotationDate.value) {

        quotationExpiry.min =
          quotationDate.value;

      }

    }

  </script>
